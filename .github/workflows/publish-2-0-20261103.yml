        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,json,base64,hashlib,tempfile,pathlib,urllib.request,urllib.error,urllib.parse,http.client,time
          P=json.loads('{"version":"2.0","repository":"krzysztofszymaniak76-beep/Diablo-Game-Reign-of-the-Warlock","branch":"codex/release-2-0-publication-20261103","releaseId":426190766,"title":"2.0 \\u2014 \\u0141adunki, kl\\u0105twy i Zimna R\\u00f3wnina","body":"Aktualizacja 2.0 \\u2014 3 listopada 2026\\n\\nW grze w wersji 1.9 u\\u017cyj przycisku aktualizacji po udost\\u0119pnieniu tego wydania jako Latest. Wydanie zawiera wcze\\u015bniejsze zmiany 1.9.\\n\\n- Rozszerzono dzia\\u0142anie istniej\\u0105cych przedmiot\\u00f3w i ich bonus\\u00f3w. Oblicze Andariel obs\\u0142uguje zweryfikowan\\u0105 Truj\\u0105c\\u0105 Nov\\u0119 i rzucanie Jadu poziomu 3 z prawid\\u0142owym zu\\u017cyciem \\u0142adunk\\u00f3w, czasem dzia\\u0142ania oraz zapisem. Poprawiono zabijanie celu w ostatniej klatce trucizny.\\n\\n- Dodano zweryfikowane rzucanie Wyssania \\u017bycia poziomu 12 ze Szpikocz\\u0142ap\\u00f3w, Obni\\u017cenia Odporno\\u015bci z obs\\u0142ugiwanych magicznych \\u017ar\\u00f3de\\u0142 oraz kl\\u0105twy Zwi\\u0119kszenia Obra\\u017ce\\u0144 z M\\u0142ota B\\u00f3lu. Zachowano osobne liczniki, pierwotne wylosowane \\u0142adunki, koszty i \\u017ar\\u00f3d\\u0142owe czasy rzucania.\\n\\n- Rozwini\\u0119to \\u017ar\\u00f3d\\u0142ow\\u0105 \\u017belazn\\u0105 Dziewic\\u0119 z czterech unikat\\u00f3w: M\\u0142ota B\\u00f3lu, Trupiego Ca\\u0142unu, Szansy Saracena i Stalowego Pancerza. Zwrot obra\\u017ce\\u0144 zachowuje kolejno\\u015b\\u0107 trafienia, w\\u0142a\\u015bciwego w\\u0142a\\u015bciciela efektu i prawid\\u0142owe rozliczenie zabicia. Zakres nowych konsument\\u00f3w pozostaje ograniczony do zweryfikowanych zwyk\\u0142ych pojedynczych przeciwnik\\u00f3w na Normalu.\\n\\n- Dopracowano premie umiej\\u0119tno\\u015bci z Szat Ormusa i Pochodni Piekielnego Ognia oraz powi\\u0105zane odzyskiwanie many. Sprawdzono obs\\u0142ugiwane uzupe\\u0142nianie \\u0142adunk\\u00f3w u NPC i w Kostce Horadrim\\u00f3w, zachowanie to\\u017csamo\\u015bci przedmiot\\u00f3w oraz cofanie nieudanych operacji.\\n\\n- Naprawiono zachowanie aktywowanych waypoint\\u00f3w po zwyk\\u0142ym Kontynuuj. Aktywny punkt w odwiedzanej lokacji otwiera podr\\u00f3\\u017c do pozosta\\u0142ych aktywowanych punkt\\u00f3w. Zmieniono 39 istniej\\u0105cych nazw lokacji i przej\\u015b\\u0107 Aktu I na oryginalne polskie nazwy; nie oznacza to dodania 39 nowych, uko\\u0144czonych map.\\n\\n- Zimna R\\u00f3wnina otrzyma\\u0142a dwa rodzaje zwyk\\u0142ych spotka\\u0144: par\\u0119 bestii oraz besti\\u0119 z szamanem i grup\\u0105 Upad\\u0142ych. Spotkania korzystaj\\u0105 z trwa\\u0142ego wyniku pierwszego wej\\u015bcia do sektora w nowym \\u015bwiecie. Sprawdzono rzeczywist\\u0105 walk\\u0119, wskrzeszanie tych samych cz\\u0142onk\\u00f3w grupy i brak dodatkowych nagr\\u00f3d po ponownym zabiciu.\\n\\n- Dodano oryginalne klasyczne animacje bestii i szamana w o\\u015bmiu kierunkach, w tym osobn\\u0105 \\u017ar\\u00f3d\\u0142ow\\u0105 warstw\\u0119 efektu czaru szamana. Poprawiono ko\\u0144c\\u00f3wk\\u0119 animacji wskrzeszania. Zimna R\\u00f3wnina korzysta z oryginalnych materia\\u0142\\u00f3w pod\\u0142o\\u017ca, przyciemnionej pami\\u0119ci terenu i czarnej mg\\u0142y nad nieodkrytymi miejscami.\\n\\n- Zachowano wcze\\u015bniejsze identyfikatory i wylosowane w\\u0142a\\u015bciwo\\u015bci przedmiot\\u00f3w oraz historie przyj\\u0119tych akcji. Gra pozostaje turowa, bez przycisku i nak\\u0142adki pauzy. Dok\\u0142adna zgodno\\u015b\\u0107 paczki, w\\u0142asne zapisy TEST i zwyk\\u0142e Kontynuuj s\\u0105 sprawdzane przed publikacj\\u0105.\\n\\n- To nadal cz\\u0119\\u015bciowa implementacja. Pe\\u0142na biblioteka bonus\\u00f3w i wszystkie receptury nie s\\u0105 uko\\u0144czone. R\\u0119czna \\u017belazna Dziewica 12 z Metalgridu ma na razie zweryfikowany fundament modelu; jej rzucanie w zwyk\\u0142ej grze pozostaje w pracy. Ratunek Caina i jego pojawienie si\\u0119 w obozie po zadaniu oraz dalsze dopracowanie tuneli, Katakumb i Zapomnianej Wie\\u017cy r\\u00f3wnie\\u017c nie s\\u0105 cz\\u0119\\u015bci\\u0105 uko\\u0144czonych funkcji tego wydania.\\n\\nSprawdzono dok\\u0142adn\\u0105 paczk\\u0119 wydania: 1507 plik\\u00f3w gry oraz wszystkie 1527 wpis\\u00f3w archiwum \\u017ar\\u00f3de\\u0142. Sze\\u015b\\u0107 kontroli zako\\u0144czy\\u0142o si\\u0119 poprawnie, w tym rzeczywista nowa gra i Kontynuuj na dw\\u00f3ch w\\u0142asnych zapisach TEST: wcze\\u015bniejszym sprawdzonym w wydaniu 1.9 oraz aktualnym po walce i wskrzeszeniach szamana. Zachowano przedmioty, zasoby i histori\\u0119 operacji. Sprawdzono widoczny ob\\u00f3z i brak pauzy. Prywatnych zapis\\u00f3w nie u\\u017cywano.\\n\\n\\u0179r\\u00f3d\\u0142a odpowiadaj\\u0105ce instalatorowi znajduj\\u0105 si\\u0119 w **Diablo-Game-Reign-of-the-Warlock-Sources-2.0.zip**. Automatyczne archiwa GitHub \\u201eSource code\\u201d odnosz\\u0105 si\\u0119 do historycznego tagu i nie s\\u0105 \\u017ar\\u00f3d\\u0142ami tego instalatora. Dotychczasowe pliki historycznej wersji 2.0 s\\u0105 zachowywane jako ARCHIWUM-20261028-*.\\n\\nSHA-256:\\n\\n- `Diablo-Game-Reign-of-the-Warlock-Setup-2.0.exe`: `9b800d7675f9351beaf3906379dccade5882eaa02230d5f988079cbf40eced78`\\n- `Diablo-Game-Reign-of-the-Warlock-Sources-2.0.zip`: `cce8cf1d5225a97875b19fd9ea788a7c4a136ef991bbde9d0d0be45cbd8a148b`\\n- `SHA256SUMS.txt`: `686eb3217bfa16e02c7618e0c0e4af016156544880135cf80c75e479b7e21978`\\n","files":[{"index":0,"key":"installer","name":"Diablo-Game-Reign-of-the-Warlock-Setup-2.0.exe","bytes":258143710,"sha256":"9b800d7675f9351beaf3906379dccade5882eaa02230d5f988079cbf40eced78","parts":[{"part":0,"offset":0,"bytes":6291456,"sha256":"1ff05407134ab64643c88fa6b35b386fb28445c146665f9755fc4adb9b550874","gitBlobSha":"48e8523e5452962bc47910a03143b218c5645c38"},{"part":1,"offset":6291456,"bytes":6291456,"sha256":"641742d298f41b0a4f931c0a1201023f660eac995dbdd2a0550ad066b7fc3c10","gitBlobSha":"612c36c7099292f15db26a2111a5ce9e74a1d152"},{"part":2,"offset":12582912,"bytes":6291456,"sha256":"bfd2b75aafa88c4c1a0f3da2b64