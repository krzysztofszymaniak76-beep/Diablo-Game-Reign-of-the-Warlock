          import os,json,base64,hashlib,tempfile,pathlib,urllib.request,urllib.error,urllib.parse,http.client,time
          P=json.loads('{"version":"2.1","repository":"krzysztofszymaniak76-beep/Diablo-Game-Reign-of-the-Warlock","branch":"codex/release-2-1-publication-20261105-2135","releaseId":426233808,"title":"2.1 \\u2014 Cain, klimat Aktu I i wygodniejsza rozgrywka","body":"Diablo 2 \\u2014 aktualizacja 2.1: Cain, klimat Aktu I i wygodniejsza rozgrywka\\n\\n- Ratunek Deckarda Caina: odnalezienie zwoju, odczytanie go u Akary, zagadka kamieni i wyprawa do Tristram. Po uwolnieniu Cain wraca do obozu i bezp\\u0142atnie identyfikuje przedmioty. Za wykonanie zadania Akara przyznaje magiczny pier\\u015bcie\\u0144.\\n\\n- Dopracowany \\u015bwiat: nowe szczeg\\u00f3\\u0142y Kamiennego Pola, Mrocznej Kniei, Tristram i Cmentarza. Tunele, grobowce, Wie\\u017ca i Katakumby otrzyma\\u0142y w\\u0142asn\\u0105 kolorystyk\\u0119, pod\\u0142o\\u017ca oraz w\\u0105skie korytarze z odnogami. Nieodkryty teren pozostaje za mg\\u0142\\u0105 wojny.\\n\\n- Czytelniejsze animacje walki: poprawione zamachy i kierunki uderze\\u0144, pe\\u0142ne wyprowadzenie ostatniego ciosu oraz lepsza widoczno\\u015b\\u0107 bohatera przy du\\u017cych przeciwnikach. Wygl\\u0105d Paladyna uwzgl\\u0119dnia kolejne obs\\u0142ugiwane zestawy wyposa\\u017cenia.\\n\\n- Ruch taktyczny: podstawowy zasi\\u0119g wynosi 5 p\\u00f3l, a aktywny Wigor zwi\\u0119ksza go do 7. Kilka \\u017ar\\u00f3de\\u0142 Wigoru nie mno\\u017cy tej premii. Pe\\u0142ny marsz trwa oko\\u0142o 3 sekund, a animacja uderzenia oko\\u0142o 2\\u20134 sekund.\\n\\n- \\u0141upy jednym przyciskiem: \\u201eZbierz wszystkie \\u0142upy\\u201d podnosi rzeczy mieszcz\\u0105ce si\\u0119 w dost\\u0119pnych miejscach, a pozosta\\u0142e zostawia na ziemi. Okna walki i \\u0142up\\u00f3w maj\\u0105 ciemne, kamienno-metalowe ramki.\\n\\n- Efekty i zapis: dopracowane wsp\\u00f3\\u0142dzia\\u0142anie obs\\u0142ugiwanych kl\\u0105tw, zamro\\u017cenia, o\\u015blepienia, spowolnienia i Otwartych Ran oraz uzupe\\u0142nianie \\u0142adunk\\u00f3w. Autozapis czeka na zako\\u0144czenie ostatniej animacji, a \\u201eKontynuuj\\u201d zachowuje wyposa\\u017cenie, odebrane nagrody i post\\u0119p zadania Caina. D\\u0142ugie opisy przedmiot\\u00f3w pozwalaj\\u0105 zamkn\\u0105\\u0107 ekwipunek.\\n","files":[{"index":0,"key":"installer","path":"D:\\\\Codex\\\\diablo-2-local-work-20261104\\\\work\\\\import-20261025\\\\D2\\\\outputs\\\\installer\\\\20261105-213151-596b2884\\\\artifacts\\\\Diablo-Game-Reign-of-the-Warlock-Setup-2.1.exe","name":"Diablo-Game-Reign-of-the-Warlock-Setup-2.1.exe","bytes":469028098,"sha256":"4dd836dbc5048895c25dc44aa12911069593cbaf3f14961c9d0241a3cac5fd5b","parts":[{"part":0,"offset":0,"bytes":6291456,"sha256":"3fda58f21a42e9b4f20b497e6b35f3162729109af4896640db93ad2828b56404","gitBlobSha":"61da1ba86a8935e69726b2b78d1a9371c69554fe"},{"part":1,"offset":6291456,"bytes":6291456,"sha256":"d9d3b8e3768b7366c71078e8b0172bd538bced2c223c4517a6575bb5897d55b4","gitBlobSha":"31831fe008751d094a613ce9ecb2cffeed6342c6"},{"part":2,"offset":12582912,"bytes":6291456,"sha256":"db6a72d73abd5022cbc4ec5c5dff86ba36fc7502e5dc6cc022c4abfbfb9221f0","gitBlobSha":"0c9e052131a3264983990079ff9a5f08d39498cc"},{"part":3,"offset":18874368,"bytes":6291456,"sha256":"201eeef3126b33c7558d31bc3ecc21b4d120f348674eac114b4268bd25af306d","gitBlobSha":"b21c5b38e1d6359f9c17a978c4541ca0c5851dfa"},{"part":4,"offset":25165824,"bytes":6291456,"sha256":"0a7c0df1186e46a198cf4334035faa34545216dc754d436d7b2e84111da81368","gitBlobSha":"ea5678f563ebfbaf11b55dbfb7a7ae8bc7add0b0"},{"part":5,"offset":31457280,"bytes":6291456,"sha256":"c0508e12de4a7de1deefb065d1052b848794436c04bfe5a719cc62cb89a58e94","gitBlobSha":"822757d8dd504231fff84d894d0248e6b26e2736"},{"part":6,"offset":37748736,"bytes":6291456,"sha256":"2c747d99eb469f22180cc9abd1f27ffedca909d33f9d8ba56e642217413d9355","gitBlobSha":"e1cbeef1c1ac5fb168783b3738813b740a894fe3"},{"part":7,"offset":44040192,"bytes":6291456,"sha256":"604ee4f2aa107d34a6abe7480d648708b089d6c9737f954f50128fa5f4a07201","gitBlobSha":"0edae6bc9e8375e58f72